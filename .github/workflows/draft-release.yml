name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Leave empty to derive v<package.json version>.
        required: false
        type: string
      target:
        description: Branch or SHA targeted by the existing signed release tag.
        required: false
        type: string
        default: main
      prerelease:
        description: Mark the draft as a prerelease.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target || 'main' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/verify-release-tag.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          tag="${INPUT_TAG:-v${package_version}}"
          expected_tag="v${package_version}"

          if [[ "$tag" != "$expected_tag" ]]; then
            echo "::error::Tag/version mismatch. Expected ${expected_tag}, got ${tag}."
            exit 1
          fi

          node .release-tools/scripts/verify-release-tag.mjs "$tag"

          release_flags=(--draft --verify-tag --title "$tag")
          if [[ "$INPUT_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" "${release_flags[@]}"
          else
            gh release create "$tag" --generate-notes "${release_flags[@]}"
          fi
