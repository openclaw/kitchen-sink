name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string
      dry_run:
        description: Validate the selected branch without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.verify.outputs.package_name }}
      package_version: ${{ steps.verify.outputs.package_version }}
      tag_name: ${{ steps.verify.outputs.tag_name }}
      tag_object: ${{ steps.verify.outputs.tag_object }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      npm_tag: ${{ steps.verify.outputs.npm_tag }}
      npm_already_published: ${{ steps.npm_exists.outputs.already_published }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.event.release.tag_name }}

      - name: Checkout release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/verify-release-tag.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"

      - name: Validate release tag and source
        id: verify
        env:
          TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          NPM_TAG="latest"

          if [[ "$PACKAGE_VERSION" == 0.0.* ]]; then
            NPM_TAG="verification"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "tag input is required for workflow_dispatch, and release.tag_name is required for release runs."
            exit 1
          fi

          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag/version mismatch."
            echo "Expected tag: $EXPECTED_TAG"
            echo "Actual tag:   $TAG_NAME"
            echo "package.json version: $PACKAGE_VERSION"
            exit 1
          fi

          if [ "$DRY_RUN" != "true" ]; then
            node .release-tools/scripts/verify-release-tag.mjs "$TAG_NAME"
          else
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "package_name=$PACKAGE_NAME"
            echo "package_version=$PACKAGE_VERSION"
            echo "tag_name=$TAG_NAME"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Setup npm
        run: npm install -g npm@12.2.1

      - name: Check if this version is already published to npm
        id: npm_exists
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && npm view "${{ steps.verify.outputs.package_name }}@${{ steps.verify.outputs.package_version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm_exists.outputs.already_published != 'true'
        run: npm ci

      - name: Run checks
        if: steps.npm_exists.outputs.already_published != 'true'
        run: npm test

      - name: Run runtime inspector
        if: steps.npm_exists.outputs.already_published != 'true'
        run: npm run plugin:inspect:runtime

      - name: Verify package payload
        if: steps.npm_exists.outputs.already_published != 'true'
        run: npm run pack:check

      - name: Pack npm release artifact
        id: pack
        if: steps.npm_exists.outputs.already_published != 'true'
        run: |
          TARBALL_NAME="$(npm pack --json | jq -r '.[].filename')"
          echo "tarball_name=$TARBALL_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload npm release artifact
        if: steps.npm_exists.outputs.already_published != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-tarball
          path: ${{ steps.pack.outputs.tarball_name }}
          if-no-files-found: error

      - name: Report already-published release state
        if: steps.npm_exists.outputs.already_published == 'true'
        env:
          TAG_NAME: ${{ steps.verify.outputs.tag_name }}
          TAG_OBJECT: ${{ steps.verify.outputs.tag_object }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          PACKAGE: ${{ steps.verify.outputs.package_name }}@${{ steps.verify.outputs.package_version }}
        run: |
          node .release-tools/scripts/verify-release-tag.mjs "$TAG_NAME" "$TAG_OBJECT" "$SOURCE_SHA"
          echo "Skipping publish: $PACKAGE is already published to npm."

  publish-npm:
    needs: validate
    if: inputs.dry_run != true && needs.validate.outputs.npm_already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout release verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/verify-release-tag.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"

      - name: Setup npm
        run: npm install -g npm@12.2.1

      - name: Download npm release artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-release-tarball
          path: ./release-artifacts

      - name: Publish to npm
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TARBALL_NAME: ${{ needs.validate.outputs.tarball_name }}
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
        run: |
          node .release-tools/scripts/verify-release-tag.mjs "$TAG_NAME" "$TAG_OBJECT" "$SOURCE_SHA"
          npm publish "./release-artifacts/$TARBALL_NAME" --access public --tag "$NPM_TAG"
