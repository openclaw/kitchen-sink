version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      openclaw-sdk:
        patterns:
          - "openclaw"
    ignore:
      - dependency-name: "openclaw"
      - dependency-name: "@openclaw/plugin-inspector"
      # SDK surface extraction needs the compiler API removed in TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
